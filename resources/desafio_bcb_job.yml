resources:
  jobs:
    desafio_bcb_pipeline:
      name: desafio-bcb-bronze-silver-gold
      description: >
        Bronze/Silver/Gold pipeline for BCB SELIC and IPCA series.
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: raw_volume_path
          default: ${var.raw_volume_path}
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/01_bronze.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              raw_volume_path: "{{job.parameters.raw_volume_path}}"

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/02_silver.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              raw_volume_path: "{{job.parameters.raw_volume_path}}"

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/03_gold.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              raw_volume_path: "{{job.parameters.raw_volume_path}}"

        - task_key: idempotency_report
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../notebooks/04_idempotency_report.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              raw_volume_path: "{{job.parameters.raw_volume_path}}"

